# =============================================================================
# Moodle Stack — Docker Compose
# =============================================================================
# Services: mysql · postgres · moodle (PHP 7/8 + Apache2) · phpmyadmin · pgadmin
# Cross-platform: Windows and Linux
#
# All configuration is driven from the .env file.
# =============================================================================

services:
  # ── MySQL 8 ────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: moodle_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MOODLE_DB_NAME:-moodle}
      MYSQL_USER: ${MOODLE_DB_USER:-moodle}
      MYSQL_PASSWORD: ${MOODLE_DB_PASSWORD:-moodlepassword}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - moodle_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: moodle_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moodle}
      POSTGRES_USER: ${POSTGRES_USER:-moodle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moodlepassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - moodle_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-moodle} -d ${POSTGRES_DB:-moodle}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Moodle (PHP + Apache2) ─────────────────────────────────────────────────
  # Moodle is installed on first start via the CLI installer.
  # config.php is persisted in the moodle38_config volume so it survives container
  # rebuilds while the database volume is still intact.
  moodle38:
    profiles: ["moodle38"]
    build:
      context: ./moodle
      args:
        PHP_VERSION: "7.4"
        MOODLE_BRANCH: MOODLE_38_STABLE
    container_name: moodle38_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MOODLE_DB_TYPE: ${MOODLE_DB_TYPE:-mysqli}
      MOODLE_DB_HOST: ${MOODLE_DB_HOST:-mysql}
      MOODLE_DB_PORT: ${MOODLE_DB_PORT:-3306}
      MOODLE_DB_NAME: moodle38
      MOODLE_DB_USER: ${MOODLE_DB_USER:-moodle}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD:-moodlepassword}
      MOODLE_DB_PREFIX: mdl_
      MOODLE_WWWROOT: https://localhost:8443
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER:-admin}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD:-password!}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL:-admin@example.com}
      MOODLE_SITE_NAME: "Moodle 3.8"
      MOODLE_SITE_SHORTNAME: moodle38
      MOODLE_REDIS_SESSION: ${MOODLE_REDIS_SESSION:-false}
      MOODLE_REDIS_HOST: ${MOODLE_REDIS_HOST:-redis}
      MOODLE_REDIS_PORT: ${MOODLE_REDIS_PORT:-6379}
    volumes:
      - moodle38_data:/var/www/moodledata
      - moodle38_config:/var/www/moodle_config
    ports:
      - "${MOODLE_PORT:-8080}:80"
      - "${MOODLE_HTTPS_PORT:-8443}:443"
    networks:
      - moodle_net

  # ── Moodle 4.5 (on-demand, profile: moodle45) ───────────────────────────────
  # Start with: docker compose --profile moodle45 up
  # HTTP  → http://localhost:8090
  # HTTPS → https://localhost:8453
  moodle45:
    profiles: ["moodle45"]
    build:
      context: ./moodle
      args:
        PHP_VERSION: "8.2"
        MOODLE_BRANCH: MOODLE_405_STABLE
    container_name: moodle45_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MOODLE_DB_TYPE: ${MOODLE_DB_TYPE:-mysqli}
      MOODLE_DB_HOST: ${MOODLE_DB_HOST:-mysql}
      MOODLE_DB_PORT: ${MOODLE_DB_PORT:-3306}
      MOODLE_DB_NAME: moodle45
      MOODLE_DB_USER: ${MOODLE_DB_USER:-moodle}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD:-moodlepassword}
      MOODLE_DB_PREFIX: mdl_
      MOODLE_WWWROOT: https://localhost:8453
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER:-admin}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD:-password!}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL:-admin@example.com}
      MOODLE_SITE_NAME: "Moodle 4.5"
      MOODLE_SITE_SHORTNAME: moodle45
      MOODLE_REDIS_SESSION: ${MOODLE_REDIS_SESSION:-false}
      MOODLE_REDIS_HOST: ${MOODLE_REDIS_HOST:-redis}
      MOODLE_REDIS_PORT: ${MOODLE_REDIS_PORT:-6379}
    volumes:
      - moodle45_data:/var/www/moodledata
      - moodle45_config:/var/www/moodle_config
    ports:
      - "${MOODLE45_PORT:-8090}:80"
      - "${MOODLE45_HTTPS_PORT:-8453}:443"
    networks:
      - moodle_net

  # ── Moodle 5.2 (on-demand, profile: moodle52) ───────────────────────────────
  # Start with: docker compose --profile moodle52 up
  # HTTP  → http://localhost:8091
  # HTTPS → https://localhost:8454
  moodle52:
    profiles: ["moodle52"]
    build:
      context: ./moodle
      args:
        PHP_VERSION: "8.3"
        MOODLE_BRANCH: MOODLE_502_STABLE
    container_name: moodle52_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MOODLE_DB_TYPE: ${MOODLE_DB_TYPE:-mysqli}
      MOODLE_DB_HOST: ${MOODLE_DB_HOST:-mysql}
      MOODLE_DB_PORT: ${MOODLE_DB_PORT:-3306}
      MOODLE_DB_NAME: moodle52
      MOODLE_DB_USER: ${MOODLE_DB_USER:-moodle}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD:-moodlepassword}
      MOODLE_DB_PREFIX: mdl_
      MOODLE_WWWROOT: https://localhost:8454
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER:-admin}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD:-password!}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL:-admin@example.com}
      MOODLE_SITE_NAME: "Moodle 5.2"
      MOODLE_SITE_SHORTNAME: moodle52
      MOODLE_REDIS_SESSION: ${MOODLE_REDIS_SESSION:-false}
      MOODLE_REDIS_HOST: ${MOODLE_REDIS_HOST:-redis}
      MOODLE_REDIS_PORT: ${MOODLE_REDIS_PORT:-6379}
    volumes:
      - moodle52_data:/var/www/moodledata
      - moodle52_config:/var/www/moodle_config
    ports:
      - "${MOODLE52_PORT:-8091}:80"
      - "${MOODLE52_HTTPS_PORT:-8454}:443"
    networks:
      - moodle_net

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: moodle_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - moodle_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── phpMyAdmin ─────────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: moodle_phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    networks:
      - moodle_net

  # ── pgAdmin ────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: moodle_pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-adminpassword}
      PGADMIN_LISTEN_PORT: 80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-8082}:80"
    networks:
      - moodle_net

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  moodle_net:
    driver: bridge

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  mysql_data:
  postgres_data:
  moodle38_data:
  moodle38_config:
  moodle45_data:
  moodle45_config:
  moodle52_data:
  moodle52_config:
  pgadmin_data:
  redis_data:
