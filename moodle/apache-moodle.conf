# Redirect all HTTP traffic to HTTPS
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    RewriteEngine On
    RewriteRule ^ ${MOODLE_HTTPS_REDIRECT_BASE}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin webmaster@localhost
    DocumentRoot ${MOODLE_DOCROOT}

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/moodle-selfsigned.crt
    SSLCertificateKeyFile /etc/ssl/private/moodle-selfsigned.key

    <Directory ${MOODLE_DOCROOT}>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Security headers
    Header always set X-Content-Type-Options  "nosniff"
    Header always set X-Frame-Options         "SAMEORIGIN"
    Header always set X-XSS-Protection        "1; mode=block"
    Header always set Referrer-Policy         "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"

    ErrorLog  ${APACHE_LOG_DIR}/moodle_error.log
    CustomLog ${APACHE_LOG_DIR}/moodle_access.log combined
</VirtualHost>
