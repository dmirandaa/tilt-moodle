---
# =============================================================================
# ConfigMap for Moodle-Specific Configuration (per version)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: moodle-app-config
  namespace: moodle
data:
  # ── Moodle 3.8 ─────────────────────────────────────────────────────────────
  MOODLE38_DB_TYPE: ${MOODLE_DB_TYPE}
  MOODLE38_DB_NAME: ${MOODLE38_DB_NAME}
  MOODLE38_DB_HOST: ${K8S_MOODLE_DB_HOST}
  MOODLE38_DB_PORT: "${MOODLE_DB_PORT}"
  MOODLE38_WWW_ROOT: "${MOODLE38_WWWROOT}"
  MOODLE38_SITE_NAME: "${MOODLE38_SITE_NAME}"
  MOODLE38_SITE_SHORTNAME: ${MOODLE38_SITE_SHORTNAME}
  MOODLE38_ADMIN_USER: ${MOODLE_ADMIN_USER}
  MOODLE38_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD}
  MOODLE38_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL}
  MOODLE38_SESSION_COOKIE_NAME: ${MOODLE38_SESSION_COOKIE_NAME}

  # ── Moodle 4.5 ─────────────────────────────────────────────────────────────
  MOODLE45_DB_TYPE: ${MOODLE_DB_TYPE}
  MOODLE45_DB_NAME: ${MOODLE45_DB_NAME}
  MOODLE45_DB_HOST: ${K8S_MOODLE_DB_HOST}
  MOODLE45_DB_PORT: "${MOODLE_DB_PORT}"
  MOODLE45_WWW_ROOT: "${MOODLE45_WWWROOT}"
  MOODLE45_SITE_NAME: "${MOODLE45_SITE_NAME}"
  MOODLE45_SITE_SHORTNAME: ${MOODLE45_SITE_SHORTNAME}
  MOODLE45_ADMIN_USER: ${MOODLE_ADMIN_USER}
  MOODLE45_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD}
  MOODLE45_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL}
  MOODLE45_SESSION_COOKIE_NAME: ${MOODLE45_SESSION_COOKIE_NAME}

  # ── Moodle 5.2 ─────────────────────────────────────────────────────────────
  MOODLE52_DB_TYPE: ${MOODLE_DB_TYPE}
  MOODLE52_DB_NAME: ${MOODLE52_DB_NAME}
  MOODLE52_DB_HOST: ${K8S_MOODLE_DB_HOST}
  MOODLE52_DB_PORT: "${MOODLE_DB_PORT}"
  MOODLE52_WWW_ROOT: "${MOODLE52_WWWROOT}"
  MOODLE52_SITE_NAME: "${MOODLE52_SITE_NAME}"
  MOODLE52_SITE_SHORTNAME: ${MOODLE52_SITE_SHORTNAME}
  MOODLE52_ADMIN_USER: ${MOODLE_ADMIN_USER}
  MOODLE52_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD}
  MOODLE52_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL}
  MOODLE52_SESSION_COOKIE_NAME: ${MOODLE52_SESSION_COOKIE_NAME}
