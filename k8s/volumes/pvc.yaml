---
# =============================================================================
# Persistent Volume Claims for all services
# =============================================================================

# ── MySQL Data PVC ────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-data-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/moodle-volumes/mysql-data
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - minikube

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: moodle
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  volumeName: mysql-data-pv
  resources:
    requests:
      storage: 20Gi

